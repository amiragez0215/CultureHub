name: culturehub
x-app: &app
  DB_URL: jdbc:mysql://mysql:3306/culturehub?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  RABBIT_HOST: rabbitmq
  RABBIT_VHOST: ${RABBIT_VHOST:-/}
  RABBIT_USER: ${RABBIT_USER:-culturehub}
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env}
  TZ: Asia/Shanghai
services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./deploy/mysql:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      retries: 30
  redis:
    image: redis:7.4.6-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:6379:6379"]
  rabbitmq:
    image: rabbitmq:4.1.4-management
    hostname: rabbitmq
    ports: ["127.0.0.1:${RABBIT_AMQP_PORT:-5672}:5672", "127.0.0.1:${RABBIT_MANAGEMENT_PORT:-15672}:15672"]
    environment:
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST:-/}
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-culturehub}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env}
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      retries: 30
  chroma:
    image: chromadb/chroma:1.0.0
    volumes: ["chroma-data:/data"]
    ports: ["127.0.0.1:8000:8000"]
  xxl-job:
    image: xuxueli/xxl-job-admin:3.1.1
    environment:
      PARAMS: --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8 --spring.datasource.username=root --spring.datasource.password=${DB_PASSWORD} --xxl.job.accessToken=${XXL_JOB_TOKEN}
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      mysql: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: deploy/Dockerfile.java, args: {MODULE: culturehub-api}}
    environment:
      <<: *app
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      REDIS_HOST: redis
      JOBS_ENABLED: "true"
      XXL_JOB_ADMIN: http://xxl-job:8080/xxl-job-admin
      XXL_EXECUTOR_ADDRESS: http://api:9999/
      XXL_JOB_TOKEN: ${XXL_JOB_TOKEN}
      AI_VECTORSTORE: ${AI_VECTORSTORE:-none}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-not-configured}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-${AI_API_KEY:-not-configured}}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-${AI_BASE_URL:-https://api.openai.com}}
      CHROMA_HOST: http://chroma
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.java, args: {MODULE: culturehub-notification-worker}}
    environment: *app
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  web:
    build: ./web
    ports: ["127.0.0.1:8089:80"]
    depends_on: [api]
volumes:
  mysql-data:
  rabbitmq-data:
  chroma-data:

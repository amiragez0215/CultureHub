spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/culturehub?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:local-password}
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health
spring.ai.model.chat: ${AI_CHAT_PROVIDER:none}
# A tool budget/validation failure must stop model execution, not be fed back for unlimited retries.
spring.ai.tools.throw-exception-on-error: true
spring.ai.model.embedding: ${AI_EMBEDDING_PROVIDER:none}
spring.ai.openai.api-key: ${AI_API_KEY:not-configured}
spring.ai.openai.base-url: ${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model: ${AI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY:not-configured}}
spring.ai.openai.embedding.base-url: ${AI_EMBEDDING_BASE_URL:${AI_BASE_URL:https://api.openai.com}}
spring.ai.openai.embedding.options.model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.vectorstore.type: ${AI_VECTORSTORE:none}
spring.ai.vectorstore.chroma.client.host: ${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port: ${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.initialize-schema: true
spring.ai.vectorstore.chroma.collection-name: culturehub
spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.timeout: 1s
culture.jwt.secret: ${JWT_SECRET}
culture.demo.password: ${DEMO_PASSWORD:}
xxl.job.admin.addresses: ${XXL_JOB_ADMIN:}
xxl.job.accessToken: ${XXL_JOB_TOKEN:local-job-token}
xxl.job.executor.address: ${XXL_EXECUTOR_ADDRESS:}
server.port: 8080
culture.jobs.enabled: ${JOBS_ENABLED:false}
mybatis-plus.configuration.call-setters-on-nulls: true

spring.rabbitmq.host: ${RABBIT_HOST:localhost}
spring.rabbitmq.port: ${RABBIT_PORT:5672}
spring.rabbitmq.username: ${RABBIT_USER:guest}
spring.rabbitmq.password: ${RABBIT_PASSWORD:guest}
spring.rabbitmq.virtual-host: ${RABBIT_VHOST:/}
spring.rabbitmq.publisher-confirm-type: correlated
spring.rabbitmq.publisher-returns: true
spring.rabbitmq.template.mandatory: true
spring.rabbitmq.connection-timeout: 3s
# Boot RabbitAdmin declares lazily on connection; never connect in a startup runner.
# Global health still reports RabbitMQ failure; readiness tracks core DB/Redis only.
spring.rabbitmq.dynamic: true
spring.rabbitmq.listener.simple.acknowledge-mode: manual
spring.rabbitmq.listener.simple.prefetch: 10
spring.rabbitmq.listener.simple.default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: culturehub-gateway
  cloud:
    loadbalancer:
      cache:
        enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 130s
    nacos:
      discovery:
        enabled: ${V3_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    sentinel:
      eager: true
      filter:
        enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
v3:
  jwt-secret: ${JWT_SECRET}
  routes:
    core: ${V3_CORE_ROUTE:lb://culturehub-core}
    notification: ${V3_NOTIFICATION_ROUTE:lb://culturehub-notification}
  gateway:
    requests-per-second: ${V3_GATEWAY_RPS:300}

management.server.port: ${V3_MANAGEMENT_PORT:9081}

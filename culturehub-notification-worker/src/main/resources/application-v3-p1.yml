spring:
  application:
    name: culturehub-notification
  datasource:
    url: ${DB_URL}
    username: culturehub_notification
    password: ${NOTIFICATION_DB_PASSWORD}
  cloud:
    loadbalancer:
      cache:
        enabled: false
    nacos:
      discovery:
        enabled: ${V3_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          culturehub-core:
            connect-timeout: 2000
            read-timeout: 3000
v3:
  jwt-secret: ${JWT_SECRET}
  core:
    token: ${V3_NOTIFICATION_CORE_TOKEN}
    url: ${V3_CORE_URL:}

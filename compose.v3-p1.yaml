name: culturehub-v3-p1

x-discovery: &discovery
  NACOS_SERVER_ADDR: nacos:8848
  TZ: Asia/Shanghai

x-amqp: &amqp
  RABBIT_HOST: rabbitmq
  RABBIT_USER: culturehub
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env.v3}

x-boundary: &boundary
  image: culturehub-v3-boundary:1.0.0
  build: {context: ., dockerfile: deploy/Dockerfile.java, args: {MODULE: culturehub-service-runtime}}
  depends_on:
    mysql: {condition: service_healthy}
    nacos: {condition: service_healthy}

services:
  mysql:
    image: culturehub-v3-mysql:8.0.44
    build: {context: ., dockerfile: deploy/v3-p1/Dockerfile.mysql}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.v3}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env.v3}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env.v3}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env.v3}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in .env.v3}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:?Set JOBS_DB_PASSWORD in .env.v3}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql:/culturehub-schema:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin --protocol=TCP -h127.0.0.1 -uroot ping --silent']
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4.6-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1.4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: culturehub
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env.v3}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      retries: 30

  nacos:
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_IDENTITY_KEY: culturehub-server
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in .env.v3}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env.v3}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness]
      interval: 5s
      retries: 30

  xxl-job:
    image: xuxueli/xxl-job-admin:3.1.1
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?characterEncoding=UTF-8
        --spring.datasource.username=culturehub_jobs
        --spring.datasource.password=${JOBS_DB_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_TOKEN:?Set XXL_JOB_TOKEN in .env.v3}
    depends_on:
      mysql: {condition: service_healthy}

  core:
    build: {context: ., dockerfile: deploy/Dockerfile.java, args: {MODULE: culturehub-api}}
    environment:
      <<: [*discovery, *amqp]
      SPRING_PROFILES_ACTIVE: v3-p1
      DB_URL: jdbc:mysql://mysql:3306/core_db?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.v3}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      REDIS_HOST: redis
      JOBS_ENABLED: "true"
      XXL_JOB_ADMIN: http://xxl-job:8080/xxl-job-admin
      XXL_EXECUTOR_ADDRESS: http://core:9999/
      XXL_JOB_TOKEN: ${XXL_JOB_TOKEN}
      V3_AI_CORE_TOKEN: ${V3_AI_CORE_TOKEN:?Set V3_AI_CORE_TOKEN in .env.v3}
      V3_KNOWLEDGE_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN:?Set V3_KNOWLEDGE_CORE_TOKEN in .env.v3}
      V3_NOTIFICATION_CORE_TOKEN: ${V3_NOTIFICATION_CORE_TOKEN:?Set V3_NOTIFICATION_CORE_TOKEN in .env.v3}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      nacos: {condition: service_healthy}
      xxl-job: {condition: service_started}

  notification:
    build: {context: ., dockerfile: deploy/Dockerfile.java, args: {MODULE: culturehub-notification-worker}}
    environment:
      <<: [*discovery, *amqp]
      SPRING_PROFILES_ACTIVE: v3-p1
      DB_URL: jdbc:mysql://mysql:3306/notification_db?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      V3_NOTIFICATION_CORE_TOKEN: ${V3_NOTIFICATION_CORE_TOKEN}
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      nacos: {condition: service_healthy}

  knowledge:
    <<: *boundary
    environment:
      <<: *discovery
      V3_ROLE: knowledge
      V3_DB_URL: jdbc:mysql://mysql:3306/knowledge_db?characterEncoding=UTF-8
      V3_DB_USER: culturehub_knowledge
      V3_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      V3_PROBE_TOKEN: ${V3_PROBE_TOKEN:?Set V3_PROBE_TOKEN in .env.v3}
      V3_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN}

  ai:
    <<: *boundary
    environment:
      <<: *discovery
      V3_ROLE: ai
      V3_DB_URL: jdbc:mysql://mysql:3306/ai_db?characterEncoding=UTF-8
      V3_DB_USER: culturehub_ai
      V3_DB_PASSWORD: ${AI_DB_PASSWORD}
      V3_PROBE_TOKEN: ${V3_PROBE_TOKEN}
      V3_CORE_TOKEN: ${V3_AI_CORE_TOKEN}

  api:
    build: {context: ., dockerfile: deploy/Dockerfile.java, args: {MODULE: culturehub-gateway}}
    environment:
      <<: *discovery
      JWT_SECRET: ${JWT_SECRET}
    ports: ["127.0.0.1:${V3_GATEWAY_PORT:-8090}:8080"]
    depends_on:
      core: {condition: service_started}
      nacos: {condition: service_healthy}

  web:
    build: ./web
    ports: ["127.0.0.1:${V3_WEB_PORT:-8089}:80"]
    depends_on:
      api: {condition: service_started}

volumes:
  mysql-data:
  rabbitmq-data:

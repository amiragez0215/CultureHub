name: culturehub-v3-p3
services:
  mysql:
    environment:
      V3_KNOWLEDGE_ENABLED: "true"
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      retries: 20
  chroma:
    image: chromadb/chroma:1.0.0
    volumes:
      - chroma-data:/data
  knowledge:
    image: culturehub-v3-knowledge:1.0.0
    build:
      args:
        MODULE: culturehub-knowledge
    environment:
      KNOWLEDGE_DB_URL: jdbc:mysql://mysql:3306/knowledge_db?characterEncoding=UTF-8
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      V3_KNOWLEDGE_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN}
      V3_AI_KNOWLEDGE_TOKEN: ${V3_AI_KNOWLEDGE_TOKEN:?Set V3_AI_KNOWLEDGE_TOKEN}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: culturehub
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      AI_VECTORSTORE: ${AI_VECTORSTORE:-none}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-not-configured}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://api.openai.com}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      CHROMA_HOST: http://chroma
    depends_on:
      minio: {condition: service_healthy}
volumes:
  minio-data:
  chroma-data:

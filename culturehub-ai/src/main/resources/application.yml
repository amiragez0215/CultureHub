server.port: ${SERVER_PORT:8080}
spring.application.name: culturehub-ai
spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
spring.datasource.url: ${AI_DB_URL}
spring.datasource.username: culturehub_ai
spring.datasource.password: ${AI_DB_PASSWORD}
spring.datasource.hikari.connection-timeout: 3000
spring.cloud.nacos.discovery.enabled: ${V3_DISCOVERY_ENABLED:true}
spring.cloud.nacos.discovery.server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.openfeign.client.config.default.connect-timeout: 2000
spring.cloud.openfeign.client.config.default.read-timeout: 5000
spring.cloud.openfeign.client.config.default.logger-level: none
spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.timeout: 1s
spring.ai.model.chat: ${AI_CHAT_PROVIDER:none}
spring.ai.model.embedding: none
spring.ai.vectorstore.type: none
spring.ai.openai.api-key: ${AI_API_KEY:not-configured}
spring.ai.openai.base-url: ${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model: ${AI_CHAT_MODEL:deepseek-chat}
spring.ai.tools.throw-exception-on-error: true
culture.jwt.secret: ${JWT_SECRET}
culture.ai.guide-v2.enabled: true
culture.ai.owner-table: ai_owner
management.endpoints.web.exposure.include: health

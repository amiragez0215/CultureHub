# Last overlay. Collector exports traces to its logs; no persistent trace store is claimed.
name: culturehub-v3
x-observed: &observed
  SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
services:
  api:
    environment: *observed
    volumes: [./deploy/v3-p6:/v3:ro]
  core: &service
    environment: *observed
    volumes: [./deploy/v3-p6:/v3:ro]
  notification: *service
  ai: *service
  knowledge: *service
  partner-a: *service
  partner-b: *service
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./deploy/v3-p6/otel-collector.yml:/etc/otelcol/config.yaml:ro]
  prometheus:
    image: prom/prometheus:v3.3.0
    volumes: [./deploy/v3-p6/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/v3-p6/datasources.yml:/etc/grafana/provisioning/datasources/culturehub.yml:ro
      - ./deploy/v3-p6/dashboards.yml:/etc/grafana/provisioning/dashboards/culturehub.yml:ro
      - ./deploy/v3-p6/culturehub-dashboard.json:/etc/grafana/dashboards/culturehub.json:ro
    ports: [127.0.0.1:3000:3000]

server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: culturehub-knowledge
  datasource:
    url: ${KNOWLEDGE_DB_URL}
    username: culturehub_knowledge
    password: ${KNOWLEDGE_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  cloud:
    loadbalancer:
      cache:
        enabled: false
    nacos:
      discovery:
        enabled: ${V3_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          culturehub-core:
            connect-timeout: 2000
            read-timeout: 3000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  ai:
    model:
      chat: none
      embedding: ${AI_EMBEDDING_PROVIDER:none}
    openai:
      api-key: ${AI_EMBEDDING_API_KEY:not-configured}
      base-url: ${AI_EMBEDDING_BASE_URL:https://api.openai.com}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      type: ${AI_VECTORSTORE:none}
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        collection-name: culturehub_v3_knowledge
        initialize-schema: true
v3:
  jwt-secret: ${JWT_SECRET}
  ai-token: ${V3_AI_KNOWLEDGE_TOKEN}
  core:
    url: ${V3_CORE_URL:}
    token: ${V3_KNOWLEDGE_CORE_TOKEN}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:culturehub-knowledge}
management:
  endpoints:
    web:
      exposure:
        include: health

# Generated by scripts/v3-p6/merge-compose.py; do not edit independently.
name: culturehub-v3
services:
  mysql:
    image: culturehub-v3-mysql:8.0.44
    build:
      context: .
      dockerfile: deploy/v3-p1/Dockerfile.mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.v3}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env.v3}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD
        in .env.v3}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env.v3}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in
        .env.v3}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:?Set JOBS_DB_PASSWORD in .env.v3}
      TZ: Asia/Shanghai
      V3_BOOKING_ENABLED: 'true'
      V3_KNOWLEDGE_ENABLED: 'true'
      V3_COMBINATION_ENABLED: 'true'
      V3_DEMO_ENABLED: ${V3_DEMO_ENABLED:-false}
      PARTNER_A_DB_PASSWORD: ${PARTNER_A_DB_PASSWORD:?Set PARTNER_A_DB_PASSWORD}
      PARTNER_B_DB_PASSWORD: ${PARTNER_B_DB_PASSWORD:?Set PARTNER_B_DB_PASSWORD}
      V3_AI_ENABLED: 'true'
    volumes:
    - mysql-data:/var/lib/mysql
    - ./deploy/mysql:/culturehub-schema:ro
    - ./deploy/migrations:/culturehub-migrations:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin --protocol=TCP -h127.0.0.1 -uroot
        ping --silent
      interval: 5s
      retries: 30
  redis:
    image: redis:7.4.6-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      retries: 20
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    - --save
    - ''
    volumes:
    - redis-data:/data
  rabbitmq:
    image: rabbitmq:4.1.4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: culturehub
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env.v3}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      retries: 30
  nacos:
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      NACOS_AUTH_IDENTITY_KEY: culturehub-server
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE
        in .env.v3}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env.v3}
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness
      interval: 5s
      retries: 30
  xxl-job:
    image: xuxueli/xxl-job-admin:3.1.1
    environment:
      PARAMS: --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?characterEncoding=UTF-8
        --spring.datasource.username=culturehub_jobs --spring.datasource.password=${JOBS_DB_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_TOKEN:?Set XXL_JOB_TOKEN in .env.v3}
    depends_on:
      mysql:
        condition: service_healthy
  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile.java
      args:
        MODULE: culturehub-api
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: culturehub
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env.v3}
      NACOS_SERVER_ADDR: nacos:8848
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: v3-p5
      DB_URL: jdbc:mysql://mysql:3306/core_db?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.v3}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      REDIS_HOST: redis
      JOBS_ENABLED: 'true'
      XXL_JOB_ADMIN: http://xxl-job:8080/xxl-job-admin
      XXL_EXECUTOR_ADDRESS: http://core:9999/
      XXL_JOB_TOKEN: ${XXL_JOB_TOKEN}
      V3_AI_CORE_TOKEN: ${V3_AI_CORE_TOKEN:?Set V3_AI_CORE_TOKEN in .env.v3}
      V3_KNOWLEDGE_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN:?Set V3_KNOWLEDGE_CORE_TOKEN
        in .env.v3}
      V3_NOTIFICATION_CORE_TOKEN: ${V3_NOTIFICATION_CORE_TOKEN:?Set V3_NOTIFICATION_CORE_TOKEN
        in .env.v3}
      V3_BOOKING_HOLD_SECONDS: ${V3_BOOKING_HOLD_SECONDS:-180}
      V3_BOOKING_OFFER_MINUTES: ${V3_BOOKING_OFFER_MINUTES:-5}
      SEATA_ENABLED: 'true'
      SEATA_SERVER_ADDR: seata:8091
      V3_COMBINATION_TOKEN: ${V3_COMBINATION_TOKEN:-${V3_ORCHESTRATOR_CORE_TOKEN:?Set
        V3_COMBINATION_TOKEN}}
      V3_DEMO_ENABLED: ${V3_DEMO_ENABLED:-false}
      AI_CHAT_PROVIDER: none
      AI_EMBEDDING_PROVIDER: none
      AI_VECTORSTORE: none
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      xxl-job:
        condition: service_started
    volumes:
    - ./deploy/v3-p6:/v3:ro
  notification:
    build:
      context: .
      dockerfile: deploy/Dockerfile.java
      args:
        MODULE: culturehub-notification-worker
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: culturehub
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env.v3}
      NACOS_SERVER_ADDR: nacos:8848
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: v3-p1
      DB_URL: jdbc:mysql://mysql:3306/notification_db?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      V3_NOTIFICATION_CORE_TOKEN: ${V3_NOTIFICATION_CORE_TOKEN}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    volumes:
    - ./deploy/v3-p6:/v3:ro
  knowledge:
    image: culturehub-v3-knowledge:1.0.0
    build:
      context: .
      dockerfile: deploy/Dockerfile.java
      args:
        MODULE: culturehub-knowledge
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      TZ: Asia/Shanghai
      V3_ROLE: knowledge
      V3_DB_URL: jdbc:mysql://mysql:3306/knowledge_db?characterEncoding=UTF-8
      V3_DB_USER: culturehub_knowledge
      V3_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      V3_PROBE_TOKEN: ${V3_PROBE_TOKEN:?Set V3_PROBE_TOKEN in .env.v3}
      V3_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN}
      KNOWLEDGE_DB_URL: jdbc:mysql://mysql:3306/knowledge_db?characterEncoding=UTF-8
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      V3_KNOWLEDGE_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN}
      V3_AI_KNOWLEDGE_TOKEN: ${V3_AI_KNOWLEDGE_TOKEN:?Set V3_AI_KNOWLEDGE_TOKEN}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: culturehub
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      AI_VECTORSTORE: ${AI_VECTORSTORE:-none}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-not-configured}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://api.openai.com}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      CHROMA_HOST: http://chroma
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
    volumes:
    - ./deploy/v3-p6:/v3:ro
  ai:
    image: culturehub-v3-ai:1.0.0
    build:
      context: .
      dockerfile: deploy/Dockerfile.java
      args:
        MODULE: culturehub-ai
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      TZ: Asia/Shanghai
      V3_ROLE: ai
      V3_DB_URL: jdbc:mysql://mysql:3306/ai_db?characterEncoding=UTF-8
      V3_DB_USER: culturehub_ai
      V3_DB_PASSWORD: ${AI_DB_PASSWORD}
      V3_PROBE_TOKEN: ${V3_PROBE_TOKEN}
      V3_CORE_TOKEN: ${V3_AI_CORE_TOKEN}
      AI_DB_URL: jdbc:mysql://mysql:3306/ai_db?connectionTimeZone=Asia/Shanghai
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      V3_AI_CORE_TOKEN: ${V3_AI_CORE_TOKEN}
      V3_AI_KNOWLEDGE_TOKEN: ${V3_AI_KNOWLEDGE_TOKEN}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-not-configured}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      REDIS_HOST: redis
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
    volumes:
    - ./deploy/v3-p6:/v3:ro
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.java
      args:
        MODULE: culturehub-gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
    ports:
    - 127.0.0.1:${V3_GATEWAY_PORT:-8090}:8080
    depends_on:
      core:
        condition: service_started
      nacos:
        condition: service_healthy
    volumes:
    - ./deploy/v3-p6:/v3:ro
  web:
    build: ./web
    ports:
    - 127.0.0.1:${V3_WEB_PORT:-8089}:80
    depends_on:
      api:
        condition: service_started
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      retries: 20
  chroma:
    image: chromadb/chroma:1.0.0
    volumes:
    - chroma-data:/data
  seata:
    image: apache/seata-server:2.5.0
    environment:
      SEATA_PORT: '8091'
      SEATA_SERVER_SERVICE_PORT: '8091'
      SERVER_PORT: '7091'
      STORE_MODE: file
      SEATA_STORE_MODE: file
      SEATA_STORE_FILE_DIR: /seata-server/sessionStore
      SEATA_STORE_FILE_FLUSH_DISK_MODE: sync
    volumes:
    - seata-data:/seata-server/sessionStore
  partner-a:
    image: culturehub-v3-core:1.0.0

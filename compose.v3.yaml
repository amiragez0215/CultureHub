      SEATA_SERVER_ADDR: seata:8091
      V3_PARTICIPANT: PARTNER_A
      V3_PARTNER_SERVICE_NAME: culturehub-partner-a
      V3_PARTNER_DB_SCHEMA: partner_db_a
      V3_PARTNER_DB_USER: culturehub_partner_a
      V3_PARTNER_DB_PASSWORD: ${PARTNER_A_DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/partner_db_a?connectionTimeZone=Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET}
      V3_AI_CORE_TOKEN: ${V3_AI_CORE_TOKEN}
      V3_KNOWLEDGE_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN}
      V3_COMBINATION_TOKEN: ${V3_COMBINATION_TOKEN:-${V3_ORCHESTRATOR_CORE_TOKEN:?Set
        V3_COMBINATION_TOKEN}}
      V3_NOTIFICATION_CORE_TOKEN: ${V3_NOTIFICATION_CORE_TOKEN}
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      RABBIT_USER: culturehub
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      AI_CHAT_PROVIDER: none
      AI_EMBEDDING_PROVIDER: none
      AI_VECTORSTORE: none
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
    volumes:
    - ./deploy/v3-p6:/v3:ro
  partner-b:
    image: culturehub-v3-core:1.0.0
    build:
      context: .
      dockerfile: deploy/Dockerfile.java
      args:
        MODULE: culturehub-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: v3-partner
      SEATA_ENABLED: 'true'
      SEATA_SERVER_ADDR: seata:8091
      V3_PARTICIPANT: PARTNER_B
      V3_PARTNER_SERVICE_NAME: culturehub-partner-b
      V3_PARTNER_DB_SCHEMA: partner_db_b
      V3_PARTNER_DB_USER: culturehub_partner_b
      V3_PARTNER_DB_PASSWORD: ${PARTNER_B_DB_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/partner_db_b?connectionTimeZone=Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET}
      V3_AI_CORE_TOKEN: ${V3_AI_CORE_TOKEN}
      V3_KNOWLEDGE_CORE_TOKEN: ${V3_KNOWLEDGE_CORE_TOKEN}
      V3_COMBINATION_TOKEN: ${V3_COMBINATION_TOKEN:-${V3_ORCHESTRATOR_CORE_TOKEN:?Set
        V3_COMBINATION_TOKEN}}
      V3_NOTIFICATION_CORE_TOKEN: ${V3_NOTIFICATION_CORE_TOKEN}
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      RABBIT_USER: culturehub
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      AI_CHAT_PROVIDER: none
      AI_EMBEDDING_PROVIDER: none
      AI_VECTORSTORE: none
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/v3/observability.properties
    volumes:
    - ./deploy/v3-p6:/v3:ro
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./deploy/v3-p6/otel-collector.yml:/etc/otelcol/config.yaml:ro
  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
    - ./deploy/v3-p6/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - ./deploy/v3-p6/datasources.yml:/etc/grafana/provisioning/datasources/culturehub.yml:ro
    - ./deploy/v3-p6/dashboards.yml:/etc/grafana/provisioning/dashboards/culturehub.yml:ro
    - ./deploy/v3-p6/culturehub-dashboard.json:/etc/grafana/dashboards/culturehub.json:ro
    ports:
    - 127.0.0.1:3000:3000
volumes:
  mysql-data: null
  rabbitmq-data: null
  redis-data: null
  minio-data: null
  chroma-data: null
  seata-data: null
